[env]
framework = arduino
build_flags =
    -I../../src
    -D __RUNTIME_PRODUCTION__
    ${sysenv.VOVK_BENCH_FLAGS}
monitor_speed = 115200

[env:esp32c3]
platform = espressif32
board = lolin_c3_mini
build_flags = ${env.build_flags} -DDEBUG_ESP_WIFI -fexceptions

[env:esp32]
platform = espressif32
board = wemos_d1_mini32
board_build.flash_mode = dio
build_flags = ${env.build_flags} -DDEBUG_ESP_WIFI -fexceptions

[env:avr_uno]
platform = atmelavr
board = uno
build_flags = ${env.build_flags} -DPLCRUNTIME_NANO

[env:avr_nano]
platform = atmelavr
board = uno
build_flags = ${env.build_flags} -DPLCRUNTIME_NANO

[env:stm32f103_bluepill_72mhz]
platform = ststm32
board = genericSTM32F103C8
debug_tool = stlink
upload_protocol = stlink
build_flags = ${env.build_flags} -flto -D LED_BUILTIN=PC13 -DPLCRUNTIME_MINIMAL
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON
    -D USBD_VID=0x0483
    -D USBD_PID=0x5740
    -D USB_MANUFACTURER="Unknown"
    -D USB_PRODUCT="\"BLUEPILL_F103C8\""
    -D HAL_PCD_MODULE_ENABLED

[env:stm32f103_bluepill_clone]
extends = env:stm32f103_bluepill_72mhz
upload_flags = -c set CPUTAPID 0x2ba01477

[env:stm32f103cb]
platform = ststm32
board = genericSTM32F103CB
debug_tool = stlink
upload_protocol = stlink
build_flags = ${env.build_flags} -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC -D USBCON -D USBD_VID=0x0483 -D USBD_PID=0x5740 -D USB_MANUFACTURER="STMicroelectronics" -D USB_PRODUCT="\"STM32 F103\"" -D HAL_PCD_MODULE_ENABLED

[env:stm32f401_blackpill_84mhz]
platform = ststm32
board = genericSTM32F401RC
debug_tool = stlink
upload_protocol = dfu
build_flags = ${env.build_flags} -D LED_BUILTIN=PC13 -D BUTTON_BUILTIN=PA0
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON
    -D USBD_VID=0x0483
    -D USBD_PID=0x5740
    -D USB_MANUFACTURER="STMicroelectronics"
    -D USB_PRODUCT="\"STM32 F401\""
    -D HAL_PCD_MODULE_ENABLED

[env:stm32f401cc_blackpill]
extends = env:stm32f401_blackpill_84mhz
board = blackpill_f401cc
build_flags = ${env.build_flags} -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC -D USBCON -D USBD_VID=0x0483 -D USBD_PID=0x5740 -D USB_MANUFACTURER="STMicroelectronics" -D USB_PRODUCT="\"STM32 F401\"" -D HAL_PCD_MODULE_ENABLED

[env:stm32f411_blackpill_100mhz]
platform = ststm32
board = blackpill_f411ce
debug_tool = stlink
upload_protocol = dfu
build_flags = ${env.build_flags}
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON
    -D USBD_VID=0x0483
    -D USBD_PID=0x5740
    -D USB_MANUFACTURER="STMicroelectronics"
    -D USB_PRODUCT="\"STM32 F411\""
    -D HAL_PCD_MODULE_ENABLED

[env:stm32f411re]
platform = ststm32
board = genericSTM32F411RE
debug_tool = stlink
upload_protocol = stlink
build_flags = ${env.build_flags} -D LED_BUILTIN=PC13

[env:stm32h743_devebox_480mhz]
platform = ststm32
board = devebox_h743vitx
board_build.mcu = stm32h743vit6
debug_tool = stlink
upload_protocol = dfu
build_flags = ${env.build_flags} -D LED_BUILTIN=PE3 -D BUTTON_BUILTIN=PC13
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON
    -D USBD_VID=0x0483
    -D USBD_PID=0x5740
    -D USB_MANUFACTURER="STMicroelectronics"
    -D USB_PRODUCT="\"STM32 H743\""
    -D HAL_PCD_MODULE_ENABLED

[env:stm32g431_blackpill_170mhz]
platform = ststm32
board = genericSTM32G431CB
debug_tool = stlink
upload_protocol = dfu
build_flags = ${env.build_flags} -D LED_BUILTIN=PC6 -D BUTTON_BUILTIN=PC13 -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC

[env:stm32wb55cg]
platform = ststm32
board = mkr_sharky
board_build.mcu = stm32wb55cg
upload_protocol = dfu
build_flags = ${env.build_flags} -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC -D USBCON -D USBD_VID=0x0483 -D USBD_PID=0x5740 -D USB_MANUFACTURER="STMicroelectronics" -D USB_PRODUCT="\"STM32 WB55\"" -D HAL_PCD_MODULE_ENABLED

[env:esp32c3_ai]
platform = espressif32
board = esp32-c3-m1i-kit
board_build.flash_mode = dio
build_flags = ${env.build_flags} -DDEBUG_ESP_WIFI -fexceptions

[env:esp32s3_zero_240mhz]
platform = espressif32
board = adafruit_feather_esp32s3
board_upload.flash_size = 4MB
build_flags = ${env.build_flags} -DDEBUG_ESP_WIFI -fexceptions -DARDUINO_USB_CDC_ON_BOOT=1 -DBOARD_HAS_PSRAM=1

[env:esp8266_d1mini_80mhz]
platform = espressif8266
board = d1_mini
board_build.flash_mode = dio
build_flags = ${env.build_flags} -DDEBUG_ESP_WIFI -fexceptions

[env:esp8266_d1mini_160mhz]
extends = env:esp8266_d1mini_80mhz
board_build.f_cpu = 160000000L

[env:rp2040]
platform = raspberrypi
board = pico
upload_protocol = picotool

[env:rp2040_133mhz]
extends = env:rp2040
build_flags = ${env.build_flags} -DVOVK_BENCH_RP2040_CLOCK_KHZ=133000

[env:rp2040_200mhz]
extends = env:rp2040
build_flags = ${env.build_flags} -DVOVK_BENCH_RP2040_CLOCK_KHZ=200000

[env:rp2040_240mhz]
extends = env:rp2040
build_flags = ${env.build_flags} -DVOVK_BENCH_RP2040_CLOCK_KHZ=240000

[env:rp2350_pico2_150mhz]
platform = raspberrypi
board = pimoroni_pico_plus_2
upload_protocol = picotool

[env:ra4m1_uno_r4_48mhz]
platform = renesas-ra
board = uno_r4_minima
board_build.mcu = ra4m1
upload_protocol = dfu

[env:nrf52840_nicenano_64mhz]
platform = nordicnrf52
board = nicenano
lib_deps = https://github.com/adafruit/Adafruit_nRF52_Arduino
upload_protocol = nrfutil

[env:air105_core_v1_204mhz]
platform = https://github.com/Jozo132/PIO-Air105.git#f707c4b75c1933488a56d131d9dda1a4a4647521
board = air105_coreboard
build_flags = ${env.build_flags} -D BUTTON_BUILTIN=-1